name: Build desktop release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .backend-venv
      - run: .backend-venv/bin/python -m pip install -r requirements-backend.txt
      - run: npm ci
      - name: Test application
        run: |
          .backend-venv/bin/python -m unittest discover -v
          npm run test:electron
          node --check electron/main.js
          node --check web/app.js
          node --check docs/download.js
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "Could not find a Developer ID Application signing identity in the imported keychain." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_NOTARIZATION_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - run: npm run make:mac
        env:
          BACKEND_PYTHON: ${{ github.workspace }}/.backend-venv/bin/python
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with:
          name: gnosis-image-search-macos-arm64
          path: |
            out/full/make/**/*
            out/update/make/**/*

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .backend-venv
      - name: Install CPU-only PyTorch
        run: .\.backend-venv\Scripts\python.exe -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: .\.backend-venv\Scripts\python.exe -m pip install -r requirements-backend.txt pyinstaller==6.22.2
      - name: Verify CPU-only PyTorch
        run: .\.backend-venv\Scripts\python.exe -c "import torch; assert torch.version.cuda is None, torch.version.cuda"
      - run: npm ci
      - name: Test application
        run: |
          .\.backend-venv\Scripts\python.exe -m unittest discover -v
          npm run test:electron
          node --check electron/main.js
          node --check web/app.js
          node --check docs/download.js
      - name: Build Windows backend
        run: npm run build:backend:win
        env:
          BACKEND_PYTHON: ${{ github.workspace }}\.backend-venv\Scripts\python.exe
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      - name: Stage bundled model
        run: '& $env:BACKEND_PYTHON scripts/prepare-bundled-model.py'
        env:
          BACKEND_PYTHON: ${{ github.workspace }}\.backend-venv\Scripts\python.exe
      - name: Package full Windows installer
        run: |
          $env:GNOSIS_TARGET_ARCH = 'x64'
          $env:GNOSIS_DISTRIBUTION = 'full'
          npx electron-forge make --platform=win32 --arch=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem 'out\full\make\zip\win32\x64\*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Forge did not produce the full Windows ZIP.' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "Gnosis-Images-Full-Installer-$version-x64.zip"
          Move-Item -Force $zip.FullName (Join-Path $zip.DirectoryName $name)
      - name: Package Windows update
        run: |
          $env:GNOSIS_TARGET_ARCH = 'x64'
          $env:GNOSIS_DISTRIBUTION = 'update'
          npx electron-forge make --platform=win32 --arch=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem 'out\update\make\zip\win32\x64\*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Forge did not produce the Windows update ZIP.' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "Gnosis-Images-Update-$version-x64.zip"
          Move-Item -Force $zip.FullName (Join-Path $zip.DirectoryName $name)
      - uses: actions/upload-artifact@v4
        with:
          name: gnosis-image-search-windows-x64
          path: |
            out/full/make/**/*
            out/update/make/**/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gnosis-image-search-*
          path: release-assets
          merge-multiple: true
      # Upload the small update first so clients from releases predating the
      # split (which selected the first compatible asset) also avoid the model.
      - name: Publish model-free update installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/update/make/**/*.dmg
            release-assets/update/make/**/*.zip
          draft: false
          generate_release_notes: true
      - name: Add full installers for new installations
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/full/make/**/*.dmg
            release-assets/full/make/**/*.exe
            release-assets/full/make/**/*.zip
