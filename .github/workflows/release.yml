name: Build desktop release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==0.36.0
      - name: Download and package image ranking model
        run: |
          python scripts/prepare-bundled-model.py
          python scripts/package-model.py
      - name: Verify model release asset size
        run: |
          asset=$(find out/model -type f -name '*.gnosis-model' -print -quit)
          if [ -z "$asset" ]; then
            echo "The image ranking model package was not created." >&2
            exit 1
          fi
          if [ "$(stat -c %s "$asset")" -gt 1992294400 ]; then
            echo "The image ranking model package exceeds 1.9 GiB: $asset" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gnosis-image-search-ranking-model
          path: out/model/*.gnosis-model

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            machine: arm64
            runner: macos-15
          - arch: x64
            machine: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native build architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - run: python -m venv .backend-venv
      - run: .backend-venv/bin/python -m pip install -r requirements-backend.txt
      - run: npm ci
      - name: Test application
        run: |
          .backend-venv/bin/python -m unittest discover -v
          npm run test:electron
          node --check electron/main.js
          node --check web/app.js
          node --check docs/download.js
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "Could not find a Developer ID Application signing identity in the imported keychain." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_NOTARIZATION_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - run: npm run make:mac
        env:
          GNOSIS_TARGET_ARCH: ${{ matrix.arch }}
          BACKEND_PYTHON: ${{ github.workspace }}/.backend-venv/bin/python
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify both macOS packages are model-free
        run: |
          if find out/full out/update -type d -name bundled-models -print -quit | grep -q .; then
            echo "A macOS application package contains bundled model files." >&2
            exit 1
          fi
      - name: Verify macOS release asset sizes
        run: |
          oversized=$(find out/full/make out/update/make -type f -name '*.dmg' -size +1900M -print -quit)
          if [ -n "$oversized" ]; then
            echo "Release asset exceeds the safe GitHub upload limit: $oversized" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gnosis-image-search-macos-${{ matrix.arch }}
          path: |
            out/full/make/**/*
            out/update/make/**/*

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .backend-venv
      - name: Install CPU-only PyTorch
        run: .\.backend-venv\Scripts\python.exe -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: .\.backend-venv\Scripts\python.exe -m pip install -r requirements-backend.txt pyinstaller==6.22.2
      - name: Verify CPU-only PyTorch
        run: .\.backend-venv\Scripts\python.exe -c "import torch; assert torch.version.cuda is None, torch.version.cuda"
      - run: npm ci
      - name: Test application
        run: |
          .\.backend-venv\Scripts\python.exe -m unittest discover -v
          npm run test:electron
          node --check electron/main.js
          node --check web/app.js
          node --check docs/download.js
      - name: Build Windows backend
        run: npm run build:backend:win
        env:
          BACKEND_PYTHON: ${{ github.workspace }}\.backend-venv\Scripts\python.exe
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      - name: Package Windows application
        run: |
          $env:GNOSIS_TARGET_ARCH = 'x64'
          $env:GNOSIS_DISTRIBUTION = 'full'
          npx electron-forge package --platform=win32 --arch=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build guided NSIS installer
        run: |
          $packagedApp = Join-Path $PWD 'out\full\Gnosis Images-win32-x64'
          npx electron-builder --win nsis --x64 --prepackaged $packagedApp --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expectedName = "Gnosis-Images-Installer-$version-x64.exe"
          $installer = Join-Path $PWD "out\full\make\$expectedName"
          if (-not (Test-Path $installer)) { throw "electron-builder did not produce $expectedName." }
      - name: Verify Windows package is model-free
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appExe = Get-ChildItem 'out\full' -Recurse -Filter 'Gnosis Images.exe' |
            Where-Object { $_.FullName -notmatch '\\make\\' } |
            Select-Object -First 1
          if (-not $appExe) { throw 'Could not find the packaged Windows executable.' }
          $bundledModels = Join-Path $appExe.Directory.FullName 'resources\bundled-models'
          if (Test-Path $bundledModels) { throw "Windows package contains bundled model files: $bundledModels" }
      - name: Verify Windows release asset sizes
        run: |
          $oversized = Get-ChildItem 'out\full\make' -Recurse -Include '*.exe' |
            Where-Object { $_.Length -gt 1900MB } |
            Select-Object -First 1
          if ($oversized) { throw "Release asset exceeds the safe GitHub upload limit: $($oversized.FullName)" }
      - uses: actions/upload-artifact@v4
        with:
          name: gnosis-image-search-windows-x64
          path: out/full/make/**/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [model, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gnosis-image-search-*
          path: release-assets
          merge-multiple: true
      # Publish the required model with the update installers so a newly
      # installed app can never observe a release that lacks its model asset.
      - name: Publish required model and model-free update installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.gnosis-model
            release-assets/update/make/**/*.dmg
            release-assets/*.exe
          draft: false
          generate_release_notes: true
      - name: Add full installers for new installations
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/full/make/**/*.dmg
            release-assets/full/make/**/*.zip
